name: Deploy Frontend

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Frontend Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BASE_URL=https://api-wismaamal.allvvnt.my.id
          push: true
          tags: ${{ env.REGISTRY }}/alfian-code/wismaamal-frontend-web:latest

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config <<EOF
          Host ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USERNAME }}
            StrictHostKeyChecking no
            ProxyCommand /usr/bin/env TUNNEL_SERVICE_AUTH_ID=${{ secrets.CF_CLIENT_ID }} TUNNEL_SERVICE_AUTH_SECRET=${{ secrets.CF_CLIENT_SECRET }} cloudflared access ssh --hostname %h
          EOF

      - name: Deploy to Remote Server
        run: |
          ssh ${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/wismaamal-deploy
            
            # Login to GHCR (Server needs to be authenticated to pull)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull frontend image and restart
            docker compose pull frontend-web
            docker compose up -d frontend-web
          EOF
